[package]
name = "wyltek-wallet-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]
name = "wyltekwalletcore"

[dependencies]
uniffi = { version = "0.31.1", features = ["cli"] }
anyhow = "1"
thiserror = "2"

# Crypto
blake2b-ref = "0.3"
secp256k1 = { version = "0.29", features = ["recovery", "rand-std"] }
fips204 = { version = "0.4.6", features = ["default-rng"] }
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"

# BIP39
bip39 = "2"

# Address encoding
bech32 = "0.11"

# Serialization
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Zeroize sensitive data
zeroize = { version = "1", features = ["derive"] }

[build-dependencies]
uniffi = { version = "0.31.1", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
